[project]
name = "backend"
version = "0.1.0"
description = "API for planning soccer practice sessions"
readme = "README.md"
authors = [
    { name = "Kalind Adhikari", email = "adhikarikalind@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.161.0",
    "sqlalchemy>=2.1.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
